<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/Burger.png">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script defer src="./scripts/script.js"></script>

</head>

<body onload="loadBurgerSandwich()">

    <header>
        <div class="headerClass">
            <img src="./assets/icons/AppIcon.png" alt="Bestell App Icon">
            <button>☰</button>
        </div>

    </header>

    <section class="heroSection">
        <div class="iconWrapper">
            <img src="./assets/img/logoBurger.png">
        </div>
    </section>

    <main>

        <div class="belowHero">

            <div class="burgerText">
                <h1>
                    <span class="red">Burger</span>House
                </h1>

                <div class="rating">
                    <p class="star"> &#9733;</p>
                    <p style="font-weight: bold;">4,1</p>
                    <p>(317)</p>
                </div>

            </div>
            <h6>The best of Burgers, Pizza, and Greens, all in one great place.</h6>
        </div>


        <div class="menuAndBasket">
            <div class="menuWrapper">
                <div class="menuHeading">
                    <img src="./assets/img/Burger.png">
                    <h3>Burgers & Sandwiches</h3>
                </div>

                <div class="menuWithBasket">
                    <div id="burgersSandwich" class="dishes">
                    </div>


                </div>
                <div class="menuHeading">
                    <img src="./assets/img/Pizza 1.png">
                    <h3>Pizza (30cm)</h3>
                </div>

                <div class="menuWithBasket">
                    <div id="pizza" class="dishes">
                    </div>

                </div>

                 <div class="menuHeading">
                    <img src="./assets/img/Salad 1.png">
                    <h3>Salad</h3>
                </div>

                <div class="menuWithBasket">
                    <div id="salad" class="dishes">
                    </div>

                </div>




            </div>

            <aside id="myBasket">
                 <div id="emptyBasket" class="emptyBasket">

                    <p>Your Basket</p>
                    <p>Nothing here yet.<br>
                    Go ahead and choose something delicious!
                    </p>
                    
                    <img src="./assets/img/basket.png" alt="basket">

                </div>
                <div class="basketWithDish" id="basketWithDish">

                </div>
            </aside>

        </div>



    </main>





    <footer>
        <div class="footerClass">
            <p>&#169; 2025 BurgerHouse</p>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>

        <div class="footerMobile">
            <nav>
                <ul class="footerMobile_wrapper">
                    <li>
                        <a href="#">
                            <img src="./assets/icons/Home.png">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./assets/icons/person.png">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./assets/icons/takeout_dining_2.png">
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <img src="./assets/icons/shopping_cart.png">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>

</body>

</html>
